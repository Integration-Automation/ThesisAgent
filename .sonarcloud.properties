# SonarCloud automatic analysis settings.
#
# scripts/ holds one-shot tools: each regenerates the figures or applies one
# editing pass to one manuscript, and each has to keep matching the paper it was
# written for. They repeat each other's boilerplate by design, and factoring
# that out would couple scripts that must stay independently reproducible, so
# they are out of the duplication metric. Every other rule still applies to
# them, and the shipped package (thesisagents/) is measured in full.
sonar.cpd.exclusions=scripts/**
